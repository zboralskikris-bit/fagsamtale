<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769aa"><link rel="manifest" href="manifest.webmanifest"><title>Fagsamtale</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f6fa;color:#152538;margin:0}main{max-width:560px;margin:auto;padding:20px}h1{margin-bottom:4px}.muted{color:#667}section{background:white;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 2px 8px #0001}.row{display:flex;gap:6px}.row button{flex:1;padding:12px 0;border:0;border-radius:8px;background:#e8edf3;font-size:17px}.row button.selected{background:#1769aa;color:white}button.action{background:#1769aa;color:white;border:0;padding:14px;border-radius:10px;width:100%;font-size:16px;margin-top:10px}textarea{width:100%;box-sizing:border-box;min-height:240px;padding:12px;font:15px/1.5 -apple-system,sans-serif;border:1px solid #ccd;border-radius:9px}input{padding:10px;border:1px solid #ccd;border-radius:8px;font-size:16px;max-width:90%}</style></head><body><main><h1>Fagsamtale</h1><p class="muted">Demo · Musikk · Kun fiktive elevdata</p><label>Elev: <input id="student" value="Emma Hansen"></label><div id="categories"></div><button class="action" id="generate">Generer fagsamtale</button><section id="result" hidden><h3>Tilbakemelding og framovermelding</h3><textarea id="feedback"></textarea><button class="action" id="copy">Kopier tekst</button></section></main><script>const categories=['Engasjement','Innsats','Samarbeid','Selvstendighet','Faglig forståelse','Arbeidskvalitet','Kreativitet','Utvikling'];let scores=JSON.parse(localStorage.getItem('fagsamtale-demo')||'null');if(!Array.isArray(scores)||scores.length!==8)scores=[5,4,6,3,4,5,4,5];function draw(){document.getElementById('categories').innerHTML=categories.map((c,i)=>`<section><strong>${c}</strong><p class="muted">${scores[i]}/6</p><div class="row">${[1,2,3,4,5,6].map(n=>`<button data-i="${i}" data-n="${n}" class="${scores[i]===n?'selected':''}">${n}</button>`).join('')}</div></section>`).join('')}document.getElementById('categories').addEventListener('click',e=>{let b=e.target.closest('button[data-i]');if(!b)return;scores[+b.dataset.i]=+b.dataset.n;localStorage.setItem('fagsamtale-demo',JSON.stringify(scores));draw()});document.getElementById('generate').onclick=()=>{let name=document.getElementById('student').value.trim()||'Eleven';let strong=categories.filter((_,i)=>scores[i]>=5).map(x=>x.toLowerCase()),improve=categories.filter((_,i)=>scores[i]<=3).map(x=>x.toLowerCase()),medium=categories.filter((_,i)=>scores[i]===4).map(x=>x.toLowerCase());let t=`Tilbakemelding:\n${name} viser ${strong.length?'gode ferdigheter innen '+strong.join(', '):'varierende måloppnåelse i faget'}. ${medium.length?'Det er også et godt grunnlag innen '+medium.join(', ')+'. ':''}${improve.length?'Det er behov for mer arbeid med '+improve.join(', ')+'.':''}\n\nFramovermelding:\n${improve.length?'Videre bør eleven prioritere '+improve.join(', ')+', og jobbe målrettet med dette i timene.':'Videre bør eleven fortsette den gode innsatsen, utfordre seg selv og utvikle ferdighetene videre.'}\n\n(Demotekst basert på valgte nivåer – gjennomgå og rediger før bruk.)`;document.getElementById('feedback').value=t;document.getElementById('result').hidden=false;document.getElementById('result').scrollIntoView({behavior:'smooth'})};document.getElementById('copy').onclick=async()=>{let t=document.getElementById('feedback');try{await navigator.clipboard.writeText(t.value);alert('Teksten er kopiert')}catch(e){t.select();alert('Marker teksten og velg Kopier')}};draw();</script></body></html>
